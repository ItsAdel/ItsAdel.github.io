<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{page.title}} · {{site.author}}{% else %}{{site.title}}{% endif %}</title>
  {% assign meta_description = page.description | default: site.description | strip %}
  <meta name="description" content="{{ meta_description }}">

  <!-- Edit site and author settings in `_config.yml` to make the social details your own -->
  <meta content="{{ site.title }}" property="og:site_name">
  <meta content="{{ page.title | default: site.title }}" property="og:title">
  <meta content="{% if page.title %}article{% else %}website{% endif %}" property="og:type">
  <meta content="{{ meta_description }}" property="og:description">
  {% if page.url %}<meta content="{{ site.url }}{{ page.url }}" property="og:url">{% endif %}
  {% if page.date %}<meta content="{{ page.date | date_to_xmlschema }}" property="article:published_time">{% endif %}
  <meta content="{{ site.url }}{{ site.baseurl }}/assets/img/{{ page.img | default: site.author-img }}" property="og:image">
  {% for tag in page.tags %}<meta content="{{ tag }}" property="article:tag">
  {% endfor %}
  <meta name="twitter:card" content="summary">
  <meta name="twitter:creator" content="@{{ site.social-twitter }}">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/{{ page.img | default: site.author-img }}">

  <link rel="icon" href="{{ "/assets/img/favicon/favicon.ico" | prepend: site.baseurl }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/img/favicon/favicon-32x32.png" | prepend: site.baseurl }}">
  <link rel="apple-touch-icon" href="{{ "/assets/img/favicon/apple-touch-icon.png" | prepend: site.baseurl }}">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">

  <!-- Apply the saved theme before first paint so there's no flash -->
  <script>
    (function () {
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | prepend: site.baseurl }}">
</head>
