{% if paginator.total_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if paginator.previous_page %}
  <a class="page-btn" href="{% if paginator.previous_page == 1 %}{{ site.baseurl }}/{% else %}{{ site.baseurl }}/page/{{ paginator.previous_page }}/{% endif %}" aria-label="Newer posts">←</a>
  {% else %}
  <span class="page-btn is-disabled">←</span>
  {% endif %}
  <span class="page-number">Page {{ paginator.page }} of {{ paginator.total_pages }}</span>
  {% if paginator.next_page %}
  <a class="page-btn" href="{{ site.baseurl }}/page/{{ paginator.next_page }}/" aria-label="Older posts">→</a>
  {% else %}
  <span class="page-btn is-disabled">→</span>
  {% endif %}
</nav>
{% endif %}
